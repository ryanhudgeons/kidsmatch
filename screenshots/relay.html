<!doctype html>
<meta charset="utf-8">
<title>relay</title>
<script>
// Temporary helper for uploading the App Store screenshots: hands image bytes to the
// opener/parent page on request. Removed once the upload is done.
addEventListener('message', async (e) => {
  if (!e.data || e.data.type !== 'get') return;
  try {
    const r = await fetch(e.data.path, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    e.source.postMessage({ type: 'file', path: e.data.path, buf }, e.origin, [buf]);
  } catch (err) {
    e.source.postMessage({ type: 'error', path: e.data.path, message: String(err) }, e.origin);
  }
});
</script>
